<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Profile | TikTok FC</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito&family=Raleway:wght@700&display=swap" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" rel="stylesheet"><link href="css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-expand-lg bg-secondary navbar-dark py-lg-0 px-lg-5"><a href="index.html" class="navbar-brand d-flex align-items-center ms-3 ms-lg-0"><img src="img/logo.png" alt="TikTok FC" style="height:60px"><h2 class="text-primary ms-2 mb-0">TikTok FC</h2></a><a href="tickets.html" class="btn btn-primary py-2 px-3 ms-auto">Tickets <i class="fa fa-ticket ms-1"></i></a></nav><header class="premium-page-header text-center"><div class="container"><p class="d-inline-block bg-secondary rounded text-primary py-2 px-3 mb-3">SUPPORTER PROFILE</p><h1 class="display-4 text-white">Your Club. Your Account.</h1><p class="mb-0">Sign in to keep your tickets, orders and match updates in one place.</p></div></header>

rvice before launching.</p></div></section></div></main><footer class="container-fluid bg-secondary text-light footer pt-5"><div class="container pb-4 d-flex justify-content-between"><p class="mb-0">© TikTok FC</p><a href="donate.html">Support the club</a></div></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script><script src="js/main.js"></script></body></html>
